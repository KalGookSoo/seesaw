name: 일반 이슈
description: 버그/기능 외의 질문, 문서, 작업 트래킹 등을 위한 일반 이슈 템플릿입니다.
title: "[이슈] "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        일반 이슈에 적합한 템플릿입니다. 필요 시 체크리스트를 자유롭게 수정하세요.
  - type: textarea
    id: context
    attributes:
      label: 현재 상황
      description: 현재 상황이나 문제점을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
      description: 이 이슈가 해결되면 어떤 결과를 기대하는지 작성해 주세요.
  - type: textarea
    id: plan
    attributes:
      label: 해결 방안(선택)
      description: 문제 해결을 위한 아이디어나 접근 방식이 있다면 설명해 주세요.
  - type: checkboxes
    id: checklist
    attributes:
      label: 체크리스트
      options:
        - label: 관련 문서/레퍼런스를 확인했습니다
        - label: 관련 담당자/팀을 지정했습니다 (가능하다면)
