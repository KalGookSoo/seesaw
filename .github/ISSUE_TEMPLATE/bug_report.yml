name: 버그 리포트
description: 재현 절차, 기대/실제 동작, 환경 정보를 포함해 버그를 보고하세요.
title: "[버그] "
labels: [bug]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        감사합니다! 아래 항목을 빠짐없이 작성해 주시면 해결에 큰 도움이 됩니다.
        - 스크린샷/에러 로그 첨부 권장
        - 최소 재현 예시가 있으면 링크 포함
  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 무엇이 문제인지 명확하고 간결하게 설명해 주세요.
      placeholder: 예) 채널 목록에서 스크롤 시 앱이 멈춥니다...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 순서대로 단계와 기대/실제 결과를 적어 주세요.
      placeholder: |
        1) ... 페이지로 이동
        2) ... 클릭
        3) ... 입력
        4) 오류 발생
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
      description: 정상적으로 기대했던 동작을 설명해 주세요.
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
      description: 실제로 관찰된 동작을 설명해 주세요.
    validations:
      required: false
  - type: textarea
    id: env
    attributes:
      label: 환경 정보
      description: OS, 브라우저, 앱 버전 등
      placeholder: |
        - OS: macOS 14.5
        - 브라우저: Chrome 130
        - 앱 버전: v1.2.3
  - type: input
    id: logs
    attributes:
      label: 관련 로그(선택)
      description: 관련 로그/에러 메시지가 있다면 붙여넣어 주세요.
  - type: checkboxes
    id: checklist
    attributes:
      label: 체크리스트
      options:
        - label: 중복 이슈가 없는지 검색했습니다
        - label: 재현 절차를 확인했습니다
