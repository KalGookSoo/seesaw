name: 기능 요청
description: 문제 배경과 원하는 해결책/대안을 포함해 제안해 주세요.
title: "[기능] "
labels: [enhancement]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        새로운 기능 제안 감사합니다! 아래 형식을 참고해 주세요.
  - type: textarea
    id: problem
    attributes:
      label: 관련 문제/배경
      description: 어떤 상황에서 불편/니즈가 발생하는지 설명해 주세요.
      placeholder: 예) 대용량 파일 업로드 시 진행률 표시가 없어 진행 상태를 알 수 없습니다.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 원하는 해결책
      description: 기능의 목표와 동작 흐름, UX를 설명해 주세요.
      placeholder: 예) 업로드 진행률을 상단 바에 %로 표시하고, 일시중지/재개 버튼 제공
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려했던 대안
      description: 다른 접근이나 대안이 있었다면 적어 주세요.
    validations:
      required: false
  - type: textarea
    id: usecases
    attributes:
      label: 사용 사례/예시
      description: 실제 사용 시나리오나 화면 흐름 예시가 있으면 적어 주세요.
  - type: checkboxes
    id: checklist
    attributes:
      label: 체크리스트
      options:
        - label: 중복 제안을 검색했습니다
        - label: 기대 효과와 범위를 명확히 작성했습니다
