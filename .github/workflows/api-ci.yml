name: SEESAW-API CI
on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'seesaw-api/**'
      - 'seesaw-core/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'seesaw-api/**'
      - 'seesaw-core/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run API tests
        run: |
          echo "API 테스트 실행 중..."
          ./gradlew :seesaw-api:test
          echo "API 테스트 완료"

      - name: Build API module
        run: |
          echo "API 모듈 빌드 중..."
          ./gradlew :seesaw-api:build -x test
          echo "API 모듈 빌드 완료"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: seesaw-api/build/reports/tests/
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-build-artifacts
          path: seesaw-api/build/libs/*.jar
          retention-days: 7
